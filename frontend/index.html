<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#"> Expense Tracker </a>
    </div>
  </nav>


  <main class="container my-4">

    <div id="alertContainer"></div>


    <div id="loadingSpinner" class="text-center my-4 d-none">

      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>

    </div>


    <div class="summary-grid mb-4">

      <div class="card text-center">
        <div class="card-body">

          <h5 class="card-title"> Total Amount </h5>

          <p id="totalAmount" class="fs-4 fw-bold"> 0 </p>

        </div>
      </div>


      <div class="card text-center">
        <div class="card-body">

          <h5 class="card-title"> Number of Expenses </h5>

          <p id="expenseCount" class="fs-4 fw-bold"> 0 </p>

        </div>
      </div>


      <div class="card text-center">
        <div class="card-body">

          <h5 class="card-title"> Highest Expense </h5>

          <p id="highestExpense" class="fs-4 fw-bold"> 0 </p>

        </div>
      </div>

    </div>


    <div class="card mb-4">

      <div class="card-body">

        <h4 class="card-title mb-3"> Add Expense </h4>

        <form id="expenseForm">

          <div class="row g-3">

            <div class="col-md-3">

              <label for="title" class="form-label"> Title </label>

              <input type="text" id="title" class="form-control" placeholder="Enter title">

            </div>


            <div class="col-md-3">

              <label for="amount" class="form-label"> Amount </label>

              <input type="number" id="amount" class="form-control" placeholder="Enter amount" step="0.01">

            </div>


            <div class="col-md-3">

              <label for="category" class="form-label"> Category </label>

              <select id="category" class="form-select">

                <option value="">Choose...</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>

              </select>

            </div>


            <div class="col-md-3">

              <label for="date" class="form-label"> Date </label>

              <input type="date" id="date" class="form-control">

            </div>

          </div>


          <button type="submit" class="btn btn-primary mt-3"> Add Expense </button>

        </form>

      </div>

    </div>


    <div class="row mb-3">

      <div class="col-md-4">

        <label for="categoryFilter" class="form-label"> Filter by Category </label>

        <select id="categoryFilter" class="form-select">

          <option value="All">All</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Bills">Bills</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>

        </select>

      </div>

    </div>


    <div class="table-responsive">

      <table class="table table-bordered table-striped align-middle">

        <thead class="table-dark">

          <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>

        </thead>

        <tbody id="expenseTableBody">

        </tbody>

      </table>

    </div>

  </main>

  <div class="modal fade" id="editExpenseModal" tabindex="-1">

    <div class="modal-dialog">

      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title"> Edit Expense </h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

        </div>


        <div class="modal-body">

          <form id="editExpenseForm">

            <input type="hidden" id="editId">


            <div class="mb-3">

              <label for="editTitle" class="form-label"> Title </label>

              <input type="text" id="editTitle" class="form-control">

            </div>


            <div class="mb-3">

              <label for="editAmount" class="form-label"> Amount </label>

              <input type="number" id="editAmount" class="form-control" step="0.01">

            </div>


            <div class="mb-3">

              <label for="editCategory" class="form-label"> Category </label>

              <select id="editCategory" class="form-select">

                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>

              </select>

            </div>


            <div class="mb-3">

              <label for="editDate" class="form-label"> Date </label>

              <input type="date" id="editDate" class="form-control">

            </div>

          </form>

        </div>


        <div class="modal-footer">

          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"> Cancel </button>

          <button type="submit" form="editExpenseForm" class="btn btn-primary"> Save Changes </button>

        </div>

      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
